<text x='760.0' y='140' font-size='16' font-weight='700' text-anchor='middle' fill='#3b2f25'>Historial de préstamos</text>
<text x='760.0' y='164' font-size='12' text-anchor='middle' fill='#6b5b4b'>se conserva al devolver el libro</text>
<text x='315' y='62' font-size='12' fill='#9b8c7b' text-anchor='middle'>Selector de prestatario</text>
